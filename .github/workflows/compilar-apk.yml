name: Compilar Lista Compras Bigsys APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ListaComprasBigsys_Proyecto_Android.zip'
      - 'ListaComprasBigsys_Proyecto_Android.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar proyecto desde ZIP
        shell: bash
        run: |
          set -e
          rm -rf build-src
          mkdir -p build-src

          if [ -f ListaComprasBigsys_Proyecto_Android.zip ]; then
            cp ListaComprasBigsys_Proyecto_Android.zip build-src/proyecto.zip
          elif [ -f ListaComprasBigsys_Proyecto_Android.txt ]; then
            cp ListaComprasBigsys_Proyecto_Android.txt build-src/proyecto.zip
          else
            echo 'No se encontró ListaComprasBigsys_Proyecto_Android.zip'
            exit 1
          fi

          unzip -q build-src/proyecto.zip -d build-src
          test -f build-src/ListaComprasBigsysAndroid/settings.gradle
          test -f build-src/ListaComprasBigsysAndroid/app/build.gradle

      - name: Compilar APK debug
        working-directory: build-src/ListaComprasBigsysAndroid
        run: gradle assembleDebug --stacktrace

      - name: Renombrar APK
        run: |
          cp build-src/ListaComprasBigsysAndroid/app/build/outputs/apk/debug/app-debug.apk ListaCompras-Bigsys.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ListaCompras-Bigsys-APK
          path: ListaCompras-Bigsys.apk
          if-no-files-found: error
