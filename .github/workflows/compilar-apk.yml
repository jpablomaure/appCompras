name: Compilar Lista Compras Bigsys APK

'on':
  workflow_dispatch: {}
  push:
    paths:
      - 'ListaComprasBigsys_Proyecto_Android.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto Android
        shell: bash
        run: |
          set -e
          rm -rf build-src
          mkdir -p build-src
          unzip -q ListaComprasBigsys_Proyecto_Android.zip -d build-src
          test -f build-src/ListaComprasBigsysAndroid/settings.gradle
          test -f build-src/ListaComprasBigsysAndroid/app/build.gradle

      - name: Compilar APK
        working-directory: build-src/ListaComprasBigsysAndroid
        run: gradle assembleDebug --stacktrace

      - name: Preparar APK para descarga
        shell: bash
        run: |
          cp build-src/ListaComprasBigsysAndroid/app/build/outputs/apk/debug/app-debug.apk ListaCompras-Bigsys.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ListaCompras-Bigsys-APK
          path: ListaCompras-Bigsys.apk
          if-no-files-found: error
